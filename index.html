<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CardBase - 10-in-1 Business Card Scanner</title>
    <meta name="description" content="Minimalist business card digitizer with 10-in-1 batch OCR, smart contact extraction, CRM sync (Apollo.io, HubSpot, Salesforce, Google Contacts), vCard QR codes, and CSV export." />
    
    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" href="/carbaseai-logo.png" />
    <link rel="apple-touch-icon" href="/carbaseai-logo.png" />
    
    <!-- Mobile PWA & Android standalone tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Android Roboto Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <meta property="og:title" content="CardBase - 10-in-1 Business Card Scanner" />
    <meta property="og:description" content="Minimalist business card digitizer with 10-in-1 batch OCR, smart contact extraction, CRM sync (Apollo.io, HubSpot, Salesforce, Google Contacts), vCard QR codes, and CSV export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
