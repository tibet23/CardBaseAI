<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CardBase - 10-in-1 Business Card Scanner</title>
    <meta name="description" content="Minimalist business card digitizer with 10-in-1 batch OCR, smart contact extraction, CRM sync (Apollo.io, HubSpot, Salesforce, Google Contacts), vCard QR codes, and CSV export." />
    
    <!-- Mobile PWA & iOS Safari standalone tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CardBase" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="CardBase - 10-in-1 Business Card Scanner" />
    <meta property="og:description" content="Minimalist business card digitizer with 10-in-1 batch OCR, smart contact extraction, CRM sync (Apollo.io, HubSpot, Salesforce, Google Contacts), vCard QR codes, and CSV export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
